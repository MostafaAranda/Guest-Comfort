<html lang="ar">
    <head>

              <!-- ~ font awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
        <a href="../Profile/profile.html" class="  my-5 fa-1xl">
            <i class="fa-solid fa-arrow-left-long m-2"></i>previous
        </a>

    <h1>Complete Payment  </h1>

    <form id="paymentForm" >
        <fieldset>
            <legend>Choose Payment Method</legend>
            
            <label>
                <input type="radio" name="paymentMethod" value="vodafoneCash" required>
                Vodafone Cash
            </label>
            <div class="payment-details vodafoneCash">
                <label for="vodafoneCashNumber">Vodavon Cash:</label>
                <input type="number" id="vodafoneCashNumber" name="vodafoneCashNumber">
            </div>

            <label>
                <input type="radio" name="paymentMethod" value="instapay">
                instapay
            </label>
            <div class="payment-details instapay">
                <label for="instapayNumber">instapay number:</label>
                <input type="number" id="instapayNumber" name="instapayNumber">
            </div>

            <label>
                <input type="radio" name="paymentMethod" value="creditCard">
                Bank Visa
            </label>
            <div class="payment-details creditCard">
                <label for="cardNumber">Card number:</label>
                <input type="number" id="cardNumber" name="cardNumber">

                <label for="cardExpiry">cardExpiry:</label>
                <input type="number" id="cardExpiry" name="cardExpiry" placeholder="MM/YY">

                <label for="cardCVC">cardCVC (CVC):</label>
                <input type="number" id="cardCVC" name="cardCVC">
            </div>
        </fieldset>
        
        <input type="submit" value=" PAY">
    </form>

    <script src="payment.js"></script>
</body>
</html>
