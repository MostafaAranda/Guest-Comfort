     <link rel="stylesheet" href="profile-reservation.css">

<body>
    
    
        <div class=" parent">
            <form id="search-form">

                <div class="input-box">
                    <label for="destination">Destination</label>
                    <select id="destination" name="destination" class="dropdown"  required>
                        <option selected disabled value=""> choose any hotel</option>
                        <option value="hotel-1">hotel-1</option>
                        <option value="hotel-2">hotel-2</option>
                        <option value="hotel-3">hotel-3</option>
                    </select>
                </div>

                <div class="input-box">
                    <label for="checkin">Check-In</label>
                    <input type="date" id="checkin" name="checkin" required>
                </div>
                <div class="input-box">
                    <label for="checkout">Check-Out</label>
                    <input type="date" id="checkout" name="checkout" required>
                </div>
                <div class="input-box">
                    <label for="natoinality">Natoinality</label>
                    <input type=text id="natoinality" name="natoinality" required>
                </div>
                <div class="input-box">
                    <label for="n_id">Natoinal ID</label>
                    <input type=number id="n_id" name="n_id" required>
                </div>
                <div class="input-box">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="dropdown"  required>
                        <option selected disabled value=""> choose any category</option>
                        <option value="Plus">Plus</option>
                        <option value="premium">Premium</option>
                        <option value="professional">Professional</option>
                    </select>
                </div>

                <div class="input-box">
                    <label for="rooms">Room</label>
                    <input type="number" id="rooms" min="1" value="1">
                </div>

                <div class="input-box">
                    <label for="adults">Adults</label>
                    <input type="number" id="adults" min="1" value="1">
                </div>

                <div class="input-box">
                    <label for="children">Children</label>
                    <input type="number" id="children" name="children" min="0" value="0">
                </div>

                <div class=" d-flex d-flex flex-row justify-content-evenly ">
                    <div class="input-box ">
                        <a href="../payment/payment.html">
                            Save
                        </a>
                    </div>

                    <div class="input-box ">
                        <a href="../get help.pdf" target="_blank">
                            get help
                        </a>
                    </div>
                </div>
              
            </form>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

<script src="../Profile/profile.js"></script>
</body>
</html>
